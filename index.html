<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compiler Automation — Run C, C++, Python, and JavaScript in your browser with AI-powered code translation."
    />
    <title>Compiler Automation</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Prism syntax highlight theme -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: var(--bg-main, #1e1e1e);
        color: var(--text-main, #cccccc);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* Remove focus ring from editor and textareas */
      textarea {
        outline: none !important;
      }

      /* VS Code-style scrollbars */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color, rgba(255, 255, 255, 0.1));
        border: 3px solid transparent;
        background-clip: padding-box;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted, rgba(255, 255, 255, 0.2));
        border: 3px solid transparent;
        background-clip: padding-box;
        border-radius: 5px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Global CSS Variables for Themes */
      :root,
      [data-theme="dark"] {
        color-scheme: dark;
        --bg-main: #1e1e1e;
        --bg-sidebar: #252526;
        --bg-header: #2d2d2d;
        --bg-hover: #37373d;
        --border-color: #444444;
        --text-main: #cccccc;
        --text-light: #ffffff;
        --text-muted: #858585;
        --text-strong: #e7e7e7;
        --accent-color: #007acc;
        --accent-hover: #519aba;
        --error-color: #f44747;
        --error-bg: rgba(244, 71, 71, 0.2);
        --error-border: rgba(244, 71, 71, 0.5);
        --skeleton-bg: #2d2d2d;
        --skeleton-grad-1: rgba(255, 255, 255, 0);
        --skeleton-grad-2: rgba(255, 255, 255, 0.04);
        --skeleton-grad-3: rgba(255, 255, 255, 0.08);
        --modal-overlay: rgba(0, 0, 0, 0.7);
        --modal-shadow: rgba(0, 0, 0, 0.5);
      }

      [data-theme="light"] {
        color-scheme: light;
        --bg-main: #ffffff;
        --bg-sidebar: #f8f9fa;
        --bg-header: #e6e5e5;
        --bg-hover: #eaecef;
        --border-color: #aeaeae;
        --text-main: #24292e;
        --text-light: #ffffff;
        --text-muted: #586069;
        --text-strong: #24292e;
        --accent-color: #0366d6;
        --accent-hover: #005cc5;
        --error-color: #d73a49;
        --error-bg: rgba(215, 58, 73, 0.1);
        --error-border: rgba(215, 58, 73, 0.4);
        --skeleton-bg: #f6f8fa;
        --skeleton-grad-1: rgba(255, 255, 255, 0);
        --skeleton-grad-2: rgba(255, 255, 255, 0.6);
        --skeleton-grad-3: rgba(255, 255, 255, 0);
        --modal-overlay: rgba(255, 255, 255, 0.8);
        --modal-shadow: rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/js.js"></script>
  </body>
</html>
